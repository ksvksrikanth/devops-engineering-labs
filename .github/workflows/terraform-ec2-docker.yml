name: Terraform EC2 Docker

on:
  push:
    branches: [ "main" ]
    paths:
      - "week2-terraform-ansible/terraform-ec2-docker/**"
      - ".github/workflows/terraform-ec2-docker.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "week2-terraform-ansible/terraform-ec2-docker/**"
      - ".github/workflows/terraform-ec2-docker.yml"
  workflow_dispatch:
    inputs:
      key_name:
        description: "Existing AWS EC2 key pair name"
        required: true
        type: string
      allowed_ssh_cidr:
        description: "Your public IP in CIDR format, example: 1.2.3.4/32"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TERRAFORM_WORKING_DIR: week2-terraform-ansible/terraform-ec2-docker
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

  terraform-plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: terraform-check

    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: |
          terraform plan \
            -out=tfplan \
            -var="key_name=${{ inputs.key_name }}" \
            -var="allowed_ssh_cidr=${{ inputs.allowed_ssh_cidr }}"

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-ec2-docker-plan
          path: ${{ env.TERRAFORM_WORKING_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 1

  terraform-apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: terraform-plan

    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}

    outputs:
      ec2_public_ip: ${{ steps.outputs.outputs.ec2_public_ip }}
      app_url: ${{ steps.outputs.outputs.app_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-ec2-docker-plan
          path: ${{ env.TERRAFORM_WORKING_DIR }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: outputs
        run: |
          echo "ec2_public_ip=$(terraform output -raw ec2_public_ip)" >> "$GITHUB_OUTPUT"
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"

      - name: Show deployment details
        run: |
          echo "EC2 public IP: ${{ steps.outputs.outputs.ec2_public_ip }}"
          echo "Application URL: ${{ steps.outputs.outputs.app_url }}"
          echo "SSH command: ssh -i your-key.pem ubuntu@${{ steps.outputs.outputs.ec2_public_ip }}"

      - name: Upload Terraform state for destroy job
        uses: actions/upload-artifact@v4
        with:
          name: terraform-ec2-docker-state
          path: |
            ${{ env.TERRAFORM_WORKING_DIR }}/terraform.tfstate
            ${{ env.TERRAFORM_WORKING_DIR }}/terraform.tfstate.backup
          if-no-files-found: error
          retention-days: 1

  manual-approval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: terraform-apply
    environment:
      name: ec2-docker-manual-deploy
      url: ${{ needs.terraform-apply.outputs.app_url }}

    steps:
      - name: Deployment testing hold
        run: |
          echo "EC2 is ready for manual Docker deployment."
          echo "Application URL: ${{ needs.terraform-apply.outputs.app_url }}"
          echo "Approve this job only after testing is complete."

  terraform-destroy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - terraform-apply
      - manual-approval

    defaults:
      run:
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Terraform state from apply job
        uses: actions/download-artifact@v4
        with:
          name: terraform-ec2-docker-state
          path: ${{ env.TERRAFORM_WORKING_DIR }}

      - name: Terraform init
        run: terraform init

      - name: Terraform destroy plan
        run: |
          terraform plan -destroy \
            -out=tfdestroyplan \
            -var="key_name=${{ inputs.key_name }}" \
            -var="allowed_ssh_cidr=${{ inputs.allowed_ssh_cidr }}"

      - name: Terraform destroy
        run: terraform apply -auto-approve tfdestroyplan
