name: Docker Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week3-docker-kubernetes/docker-flask-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t docker-flask-api:${{ github.sha }} .

      - name: Run container for smoke test
        run: |
          docker run -d --name flask-api-test -p 5000:5000 docker-flask-api:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:5000/health
          docker logs flask-api-test
          docker stop flask-api-test
          docker rm flask-api-test
